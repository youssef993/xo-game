spring.application.name=player-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/player_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.open-in-view= false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql= true

spring.security.oauth2.resourceserver.jwt.issuer-uri= ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/xo-realm}

management.endpoints.web.exposure.include+ health,info,metrics

management.endpoint.health.probes.enabled: true

logging.level.com.xogame.player_service: DEBUG


