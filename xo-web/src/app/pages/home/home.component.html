
<main class="app-shell page-enter">
  <section class="content">
    <div class="user-summary">
      <div class="avatar">{{ (auth.user()?.username ?? 'U').slice(0, 2).toUpperCase() }}</div>
      <div>
        <strong>{{ auth.user()?.username ?? 'Joueur' }}</strong>
        <p>Niveau 12</p>
      </div>
      <div class="score">🏆 2350</div>
    </div>

    <h1>Que veux-tu faire ?</h1>

    <div class="menu-list">
      @for (item of menuItems; track item.title) {
      <a class="menu-card" [routerLink]="item.route">
        <span class="menu-icon">{{ item.icon }}</span>
        <span>
                <strong>{{ item.title }}</strong>
                <small>{{ item.subtitle }}</small>
              </span>
        <span class="arrow">›</span>
      </a>
      }
    </div>
  </section>
  <app-bottom-nav />
</main>
