<main class="auth-page page-enter">
  <section class="auth-card">
    <div class="brand-mark">
      <span class="x">X</span>
      <span class="dash">−</span>
      <span class="o">O</span>
    </div>
    <h1>X-O Multiplayer</h1>
    <p class="muted">Joue. Défie. Gagne.</p>

    <div class="auth-actions">
      <button class="social-button google" routerLink="/home">
        <span class="social-icon">G</span> Continuer avec Google
      </button>
      <button class="social-button facebook" routerLink="/home">
        <span class="social-icon">f</span> Continuer avec Facebook
      </button>
      <button class="primary-button" routerLink="/home">
        Continuer avec un email
      </button>
    </div>

    <p class="small-text">Pas encore de compte ? <strong>S’inscrire</strong></p>
  </section>
</main>
